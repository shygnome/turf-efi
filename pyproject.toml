[project]
name = "turf-efi"
version = "0.1.0"
description = "Open research library proposing algorithms that approximate FIFA EFI-style metrics (unit lines, line-breaking passes) from tracking data."
readme = "README.md"
authors = [
    { name = "shygnome", email = "shygnome3@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[build-system]
requires = ["uv_build>=0.6.6,<2"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0",
    "ruff>=0.3",
    "pandas-stubs>=2.0",
]
viz = [
    "matplotlib>=3.7",
    "mplsoccer>=1.2",
]

[tool.uv.build-backend]
module-name = "turf.efi"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true



[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "real_data: marks tests that require data/ to be populated",
]
